<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" fill="#ffffff"/>
  
  <!-- Flag Emblem Top -->
  <g transform="translate(210, 100)">
    <!-- Blue Quarter -->
    <rect x="0" y="0" width="40" height="25" fill="#005293"/>
    <polygon points="12,12 15,5 18,12 25,12 19,16 21,22 15,18 9,22 11,16 6,12" fill="#ffffff"/>
    
    <!-- Red Quarter -->
    <rect x="40" y="0" width="40" height="25" fill="#d21034"/>
    
    <!-- White Bottom Left -->
    <rect x="0" y="25" width="40" height="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- White Bottom Right with Red Star -->
    <rect x="40" y="25" width="40" height="25" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <polygon points="60,37 63,30 66,37 73,37 67,41 69,47 63,43 57,47 59,41 54,37" fill="#d21034"/>
  </g>

  <!-- GOBIERNO NACIONAL -->
  <text x="250" y="210" font-family="'Montserrat', 'Public Sans', sans-serif" font-size="28" font-weight="600" fill="#555555" letter-spacing="8" text-anchor="middle">
    GOBIERNO NACIONAL
  </text>

  <!-- Stars and Slogan: ★ CON PASO FIRME ★ -->
  <text x="250" y="270" font-family="'Montserrat', 'Public Sans', sans-serif" font-size="34" font-weight="800" fill="#555555" text-anchor="middle">
    <tspan fill="#d21034">★ </tspan>CON PASO FIRME<tspan fill="#d21034"> ★</tspan>
  </text>

  <!-- Divider Line -->
  <line x1="60" y1="310" x2="440" y2="310" stroke="#555555" stroke-width="3"/>

  <!-- MINISTERIO DE EDUCACIÓN -->
  <text x="250" y="370" font-family="'Montserrat', 'Public Sans', sans-serif" font-size="30" font-weight="800" fill="#333333" letter-spacing="2" text-anchor="middle">
    MINISTERIO DE EDUCACIÓN
  </text>
</svg>
